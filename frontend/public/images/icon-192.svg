<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="nk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#nk-grad)"/>
  <!-- Karnataka Emblem Heritage Arch Motif -->
  <path d="M 46 142 C 46 82, 146 82, 146 142" fill="none" stroke="url(#gold-grad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Central Pin / Stupa Silhouette -->
