  <circle cx="96" cy="74" r="10" fill="#0f766e"/>
  <path d="M 96 96 L 96 136" stroke="url(#gold-grad)" stroke-width="6" stroke-linecap="round"/>
  <!-- Bilingual Initial Accent -->
  <text x="96" y="166" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#fef3c7" text-anchor="middle">ನಮ್ಮ NK</text>
